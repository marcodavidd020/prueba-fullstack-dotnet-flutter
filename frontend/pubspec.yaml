name: sol_catalog
description: >-
  Buscador de productos — prueba técnica Flutter + .NET.
  Listado, búsqueda y edición de precio sobre Clean Architecture.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  rxdart: ^0.28.0

  equatable: ^2.0.7

  get_it: ^9.2.1

  dio: ^5.11.0

  go_router: ^17.5.0

  decimal: ^3.2.6
  intl: ^0.20.3

  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  bloc_test: ^10.0.0
  mocktail: ^1.0.5

  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
